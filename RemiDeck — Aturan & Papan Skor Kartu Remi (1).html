<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RemiDeck — Aturan & Papan Skor Kartu Remi</title>
<style>
:root{
  --bg:#f5f4ef;--surface:#fff;--surface2:#efeee7;--ink:#1b1d1a;--muted:#686c64;--line:#e3e0d5;
  --accent:#17794f;--accent-ink:#fff;--accent-soft:#dff1e7;
  --gold:#a96a0f;--gold-soft:#fbefd3;--danger:#c0392b;--danger-soft:#fbe3df;
  --shadow:0 1px 2px rgba(20,25,20,.06),0 8px 24px rgba(20,25,20,.06);
  --r:16px;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0e1310;--surface:#161c18;--surface2:#1e2620;--ink:#eef2ed;--muted:#98a299;--line:#28322b;
  --accent:#3dcc8c;--accent-ink:#06210f;--accent-soft:#16352a;
  --gold:#e8b44f;--gold-soft:#352a10;--danger:#ff8070;--danger-soft:#3b1d19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:980px}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* top / header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;grid-template-columns:1fr 1fr;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);place-items:center;font-size:15px;line-height:1;padding:7px;box-shadow:var(--shadow)}
.logo i{font-style:normal}.logo .r{color:#d4483b}.logo .g{color:var(--gold)}
.brand h1{font-size:21px;letter-spacing:-.02em;line-height:1.1}
.brand p{font-size:13px;color:var(--muted)}
.icon{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.icon:active{transform:scale(.96)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;background:var(--surface2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.lg{min-height:52px;font-size:16px;width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(23,121,79,.25)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{font-weight:500;opacity:.8;font-size:11px}
.x{width:40px;height:40px;border-radius:10px;color:var(--muted);font-size:15px}
.x:hover{background:var(--surface2)}

/* home */
.search input{width:100%;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 0}
.resume{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--gold-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.resume b{font-size:13px;color:var(--gold)}
.resume button{padding:6px 12px;border-radius:999px;background:var(--surface);font-weight:650;font-size:13px;border:1px solid var(--line)}
.count{margin:14px 0 10px;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.gcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.gc-top{display:flex;gap:12px;align-items:flex-start}
.em{width:46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:24px;flex:none;position:relative}
.dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.gc-top h2{font-size:17px;line-height:1.25;letter-spacing:-.01em}
.gc-top p{font-size:13px;color:var(--muted);margin-top:2px}
.goal{font-size:14px;color:var(--ink);opacity:.85}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.meta .lvl{background:var(--gold-soft);color:var(--gold)}
.gc-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.empty{text-align:center;padding:48px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:6px 0}
footer.f{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}

/* game header */
.gh{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid transparent}
.gh.stuck{border-color:var(--line)}
.gh-row{display:flex;align-items:center;gap:10px}
.gh-t{flex:1;min-width:0}
.gh-t h1{font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-t p{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;margin-top:10px}
.seg button{min-height:42px;border-radius:10px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.sm{margin:0 0 12px}.seg.sm button{min-height:38px;font-size:13px}

/* rules */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{padding:16px;margin-top:14px}
.hero .goal{font-size:15px;opacity:1}
.hero .meta{margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;font-weight:650;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
details.sec{margin-top:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:15px;min-height:52px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .n{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;flex:none}
details.sec>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details.sec[open]>summary .chev{transform:rotate(180deg)}
.sec-b{padding:0 16px 16px;font-size:14.5px}
.sec-b ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.sec-b li{position:relative;padding-left:16px}
.sec-b li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sec-b li ul{margin-top:8px;gap:6px}
.sec-b li li::before{background:var(--line);width:5px;height:5px}
.sec-b strong{font-weight:700}
.rules-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* board */
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.ok{color:var(--accent)}.pill.warn{color:var(--danger)}
.tb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tb .btn{flex-direction:column;gap:0;padding:6px 4px;min-height:52px;font-size:12px;line-height:1.25}
.tb .btn span{font-size:17px}
.banner{padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--gold-soft),var(--accent-soft));display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-weight:750}
.hint{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;margin-bottom:12px;display:grid;gap:4px}
.lb{display:grid;gap:10px}
.row{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.row.lead{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%)}
.row.dim{opacity:.55}
.row-main{display:flex;align-items:center;gap:12px}
.rk{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.row.lead .rk{background:var(--gold);color:#fff}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chip{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.pos{background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--danger-soft);color:var(--danger)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.val{text-align:right;line-height:1.05}
.val .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.val .u{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:2px}
.val.neg .v{color:var(--danger)}.val.pos .v{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.row.lead .bar i{background:var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 calc(50% - 8px);min-height:44px;font-size:13px}
.acts .btn.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.acts .btn.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.acts .btn.warn{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.tokens{display:flex;gap:6px;margin-top:12px}
.tokens span{flex:1;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface2);color:var(--muted)}
.tokens span.on{background:var(--danger);color:#fff}
.dock{position:sticky;bottom:0;z-index:10;margin:14px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
details.hist{margin-top:14px;overflow:hidden}
details.hist>summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;font-size:14px;min-height:50px;display:flex;align-items:center}
details.hist>summary::-webkit-details-marker{display:none}
.h-i{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--line);font-size:13px}
.h-i>div{flex:1;min-width:0}
.h-i b{font-size:13px}

/* sheet */
.sw{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sw[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,11,.55);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s cubic-bezier(.16,1,.3,1)}
@media(min-width:600px){.sw{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 20px}
.sheet-head h3{font-size:18px}
.sheet-body{overflow-y:auto;padding:8px 20px 16px;flex:1}
.sheet-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sheet-foot:empty{display:none}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.frow-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.frow-h .net{font-weight:800;font-size:15px}
.net.pos,.pos{color:var(--accent)}.net.neg,.neg{color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.lbl.pos{color:var(--accent)}.lbl.neg{color:var(--danger)}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:44px;height:48px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:20px;flex:none}
.stp input{flex:1;min-width:0;width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:800;font-size:18px;font-family:ui-monospace,Menlo,monospace}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;inset:0}
.pick span{display:block;padding:11px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:650;min-height:44px}
.pick input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--gold-soft);margin:14px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.check div{flex:1;font-weight:700;font-size:14px}.check small{display:block;font-weight:500;color:var(--muted)}
.pvbox{text-align:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:20px}
.set{margin-bottom:20px}
.rn{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.rn input,.set textarea{flex:1;min-width:0;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.set textarea{height:90px;padding:10px;width:100%;font:12px ui-monospace,Menlo,monospace;resize:vertical}
.ord{display:grid;gap:8px;margin-bottom:14px}
.ord-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:650}
.ord-i .no{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.ord-i small{margin-left:auto;color:var(--muted);font-weight:600}
.big{font-size:44px;font-weight:800;text-align:center;margin:10px 0}
.out{text-align:center;font-size:26px;font-weight:800;min-height:40px;color:var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* tabletop */
#tt{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px}
#tt[hidden]{display:none}
.tt-in{max-width:900px;margin:0 auto}
.tt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tt-h h2{font-size:20px}
.tt-r{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.tt-r.lead{border-color:var(--gold);background:var(--gold-soft)}
.tt-r .nm{flex:1;font-size:clamp(20px,4vw,34px);font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tt-r .v{font-size:clamp(44px,12vw,92px);font-weight:800;line-height:1}


/* contoh kartu */
.ex{display:grid;gap:16px}
.ex h4{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.exr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px;padding:10px;border-radius:12px;background:var(--surface2)}
.cards{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cards .gp{width:2px;height:48px;background:var(--line);margin:0 6px;border-radius:2px}
.cards .op{font-weight:800;color:var(--muted);padding:0 2px}
.pc{display:inline-block;position:relative;width:38px;height:54px;border-radius:7px;background:#fff;border:1px solid #d3d1c6;box-shadow:0 1px 2px rgba(0,0,0,.15);color:#1b1d1a;flex:none}
.pc.red{color:#d03a2e}
.pc .cv{position:absolute;top:3px;left:4px;font-size:13px;line-height:1;font-weight:800;letter-spacing:-.5px}
.pc .cv i{display:block;font-style:normal;font-size:10px;margin-top:1px;letter-spacing:0}
.pc .st{position:absolute;right:4px;bottom:2px;font-size:22px;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,#2f6f55 0 4px,#26594a 4px 8px);border-color:#1b4437}
.exl{flex:1 1 120px;font-size:13px;font-weight:650;line-height:1.35}
.exl.ok{color:var(--accent)}.exl.no{color:var(--danger)}

/* toast */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-90px);z-index:80;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.16,1,.3,1);max-width:calc(100vw - 24px)}
.toast.show{transform:translate(-50%,0)}
.toast button{font-weight:800;color:var(--accent);padding:6px 10px;border-radius:8px;background:rgba(127,127,127,.2)}
:root[data-theme=dark] .toast button{color:var(--accent-ink);background:var(--accent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="tt" hidden></div>
<div id="sheet" class="sw" hidden>
  <div class="scrim" data-act="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="x" data-act="sheet-close" aria-label="Tutup">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============================================================
   UTIL
============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => s.replace(/\*\*(.+?)\*\*/g, '$1');
const wab = s => s.replace(/\*\*(.+?)\*\*/g, '*$1*');
const uid = () => 'p' + Math.random().toString(36).slice(2, 8);

/* ============================================================
   STATE
============================================================ */
const KEY = 'remideck3_';
let S = null, cur = null, route = { n: 'home' }, stack = [], tt = false, histOpen = false, sheetKind = null, draft = null, timers = [];
const F = { q: '', pl: 'all', cat: 'all' };

const P = id => S.players.find(p => p.id === id);
const nm = id => P(id) ? P(id).name : '(dihapus)';
const cnt = (pid, k) => S.rounds.filter(r => r.p === pid && r.k === k).length;
const last = () => S.rounds[S.rounds.length - 1];
function rankRows(rows, cmp) {
  rows.sort(cmp);
  rows.forEach((r, i) => { r.rank = i > 0 && cmp(rows[i - 1], r) === 0 ? rows[i - 1].rank : i + 1; });
  return rows;
}
const stp = (name, val, step = 1, min = 0, max = 9999) =>
  `<div class="stp"><button type="button" data-step="${-step}" aria-label="Kurangi">−</button><input type="number" inputmode="numeric" name="${name}" value="${val}" min="${min}" max="${max}"><button type="button" data-step="${step}" aria-label="Tambah">＋</button></div>`;
const names = (ent, n) => ent === 'Tim' ? ['Tim A', 'Tim B', 'Tim C', 'Tim D'].slice(0, n) : Array.from({ length: n }, (_, i) => 'Pemain ' + (i + 1));

function fresh(g) {
  return { v: 3, players: names(g.ent, g.def).map(n => ({ id: uid(), name: n })), settings: { ...g.settings }, rounds: [] };
}
function load(g) {
  try {
    const raw = store.get(KEY + g.id);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.players) && Array.isArray(d.rounds) && d.players.every(p => p && p.id && typeof p.name === 'string'))
        return { v: 3, players: d.players, rounds: d.rounds, settings: { ...g.settings, ...(d.settings || {}) } };
    }
  } catch (e) {}
  return fresh(g);
}
const save = () => store.set(KEY + cur.id, JSON.stringify(S));
function hasProgress(g) {
  try { const d = JSON.parse(store.get(KEY + g.id) || 'null'); return !!(d && d.rounds && d.rounds.length); } catch (e) { return false; }
}
function mutate(label, fn, opts = {}) {
  stack.push(JSON.stringify(S)); if (stack.length > 30) stack.shift();
  fn(S); save(); renderView(); if (sheetKind === 'settings' && !opts.keepSheet) fillSettings();
  if (label) toast(label, true);
}
function undo() {
  const p = stack.pop(); if (!p) return;
  S = JSON.parse(p); save(); renderView(); if (sheetKind === 'settings') fillSettings(); toast('Dibatalkan');
}

/* ============================================================
   ENGINE PER PERMAINAN
============================================================ */
const hist = (arr) => arr.join('');
const capsaPts = n => n === 0 ? 0 : n <= 7 ? n : n <= 9 ? n * 2 : n <= 12 ? n * 3 : 52;
const capsaMul = n => n === 0 ? 'MENANG' : n <= 7 ? '×1' : n <= 9 ? '×2' : n <= 12 ? '×3' : '×4';
const R = { P: { l: '👑 President', pts: 2 }, VP: { l: '🎖️ Vice President', pts: 1 }, C: { l: '🧑 Citizen', pts: 0 }, VS: { l: '🧹 Vice Scum', pts: -1 }, S: { l: '💩 Scum', pts: -2 } };
const presRank = (pos, n) => pos === 0 ? R.P : (n >= 4 && pos === 1) ? R.VP : pos === n - 1 ? R.S : (n >= 4 && pos === n - 2) ? R.VS : R.C;
const roundTitle = g => g.kind === 'sheet' ? 'Ronde ' + (S.rounds.length + 1) : '';

function evRows(g, valFn, cmp, decorate) {
  const rows = S.players.map(p => { const r = { p, v: valFn(p) }; decorate(r, p); return r; });
  return rankRows(rows, cmp);
}
const evAct = (k, label, tone) => `<button class="btn ${tone}" data-act="ev" data-kind="${k}">${label}</button>`;

Object.assign(GAMES.find(g => g.id === 'rummy-500'), {
  kind: 'sheet', ent: 'Pemain', min: 3, max: 8, def: 3, settings: { target: 500 }, tgt: { label: 'Target poin', min: 50, step: 50 },
  total(pid) { return S.rounds.reduce((a, r) => a + (r.e[pid] ? r.e[pid].d - r.e[pid].h : 0), 0); },
  rows() {
    const rows = rankRows(S.players.map(p => { const s = this.total(p.id); return { p, s, valueText: s, unit: 'poin', tone: s < 0 ? 'neg' : '', progress: s / S.settings.target }; }), (a, b) => b.s - a.s);
    rows.forEach(r => r.lead = r.rank === 1 && S.rounds.length > 0 && r.s > 0); return rows;
  },
  winner() { if (!S.rounds.length) return null; const t = this.rows()[0]; return t.s >= S.settings.target ? t.p.name : null; },
  form() { return S.players.map(p => `<div class="frow" data-pid="${p.id}"><div class="frow-h"><b>${esc(p.name)}</b><span class="net" data-net>0</span></div><div class="two"><div><span class="lbl pos">Turun (+)</span>${stp('d_' + p.id, 0, 5)}</div><div><span class="lbl neg">Sisa (−)</span>${stp('h_' + p.id, 0, 5)}</div></div></div>`).join(''); },
  preview(f) { S.players.forEach(p => { const n = num(f.elements['d_' + p.id].value) - num(f.elements['h_' + p.id].value); const el = f.querySelector(`[data-pid="${p.id}"] [data-net]`); el.textContent = sg(n); el.className = 'net ' + (n > 0 ? 'pos' : n < 0 ? 'neg' : ''); }); },
  read(f) { const e = {}; S.players.forEach(p => e[p.id] = { d: num(f.elements['d_' + p.id].value), h: num(f.elements['h_' + p.id].value) }); return { round: { id: uid(), e } }; },
  hist(r) { return hist(Object.entries(r.e).map(([id, e]) => chip(nm(id) + ' ' + sg(e.d - e.h), e.d - e.h >= 0 ? 'pos' : 'neg'))); }
});

function parseHash() {
  try { const m = (location.hash || '').match(/^#g-([a-z0-9-]+)-(rules|board)$/); if (m) return { n: 'game', id: m[1], tab: m[2] }; } catch (e) {}
  return { n: 'home' };
}
function go(r, fromHash) {
  closeSheet(true); tt = false; histOpen = false;
  if (r.n === 'game') {
    const g = GAMES.find(x => x.id === r.id); if (!g) { r = { n: 'home' }; } else if (!cur || cur.id !== g.id) { cur = g; S = load(g); stack = []; }
  }
  route = r;
  if (!fromHash) { try { location.hash = r.n === 'game' ? `g-${r.id}-${r.tab}` : ''; } catch (e) {} }
  renderView(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  const r = parseHash();
  if (r.n !== route.n || r.id !== route.id || r.tab !== route.tab) go(r, true);
});
window.addEventListener('scroll', updateStuck, { passive: true });

  return false;
}

  $('#sheetBody').innerHTML = `<p style="font-size:13.5px;color:var(--muted);margin:0 0 12px">Ketuk pemain sesuai urutan <b>selesai</b> (yang kartunya habis duluan). Pemain terakhir terisi otomatis.</p>
  <div class="ord">${draft.map((id, i) => `<div class="ord-i"><span class="no">${i + 1}</span>${esc(nm(id))}<small>${presRank(i, n).l} · ${sg(presRank(i, n).pts)}</small></div>`).join('')}</div>
  ${rem.length ? `<span class="lbl">Belum selesai</span><div class="pick">${rem.map(p => `<button type="button" class="btn" data-act="ord-add" data-pid="${p.id}">${esc(p.name)}</button>`).join('')}</div>` : ''}
  ${draft.length ? `<button class="btn" data-act="ord-undo">↩ Hapus urutan terakhir</button>` : ''}`;
  $('#sheetFoot').innerHTML = `<button class="btn" data-act="sheet-close">Batal</button><button class="btn primary" data-act="round-save" ${draft.length === n ? '' : 'disabled'}>✓ Simpan ronde</button>`;
}
function settingsHtml() {
  const g = cur, ent = g.ent === 'Tim' ? 'tim' : 'pemain';
  return `${g.tgt ? `<div class="set"><span class="lbl">${g.tgt.label}</span>${stp('target', S.settings.target, g.tgt.step, g.tgt.min).replace('<input', '<input data-set="target"')}</div>` : ''}
  <div class="set"><span class="lbl">${g.ent === 'Tim' ? 'Tim' : 'Pemain'} (${S.players.length}/${g.max})</span>
    ${S.players.map(p => `<div class="rn"><input data-rn="${p.id}" value="${esc(p.name)}" maxlength="24" aria-label="Nama">${!g.fixed && S.players.length > g.min ? `<button class="x" data-act="pl-del" data-id="${p.id}" aria-label="Hapus ${esc(p.name)}">🗑</button>` : ''}</div>`).join('')}
    ${!g.fixed && S.players.length < g.max ? `<form id="addf" class="rn"><input id="addn" maxlength="24" placeholder="Nama ${ent} baru"><button class="btn soft">＋ Tambah</button></form>` : ''}</div>
  <div class="set"><span class="lbl">Permainan</span><div class="two"><button class="btn soft" data-act="newgame">🔄 Game baru<br><small>nama tetap, skor 0</small></button><button class="btn danger" data-act="reset">🗑 Reset total<br><small>nama ikut direset</small></button></div></div>
  <div class="set"><span class="lbl">Bagikan & cadangan</span><div class="two"><button class="btn" data-act="share">📤 Bagikan skor</button><button class="btn" data-act="exp-copy">💾 Salin data</button></div>
    <textarea id="impTa" placeholder="Tempel data cadangan di sini untuk memulihkan…" style="margin-top:8px"></textarea><button class="btn" style="margin-top:8px;width:100%" data-act="imp-go">⬇ Pulihkan dari data</button></div>`;
}
function fillSettings() { $('#sheetBody').innerHTML = settingsHtml(); }

/* ============================================================
   EVENTS
============================================================ */
const ACT = {
  home: () => go({ n: 'home' }),
  open: t => go({ n: 'game', id: t.dataset.id, tab: t.dataset.tab || 'rules' }),
  tab: t => go({ n: 'game', id: cur.id, tab: t.dataset.tab }),
  theme: () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; store.set('rd_theme', d); renderView(); },
  fpl: t => { F.pl = t.dataset.v; updateList(); },
  fcat: t => { F.cat = t.dataset.v; updateList(); },
  freset: () => { F.q = ''; F.pl = 'all'; F.cat = 'all'; const q = $('#q'); if (q) q.value = ''; updateList(); },
  undo: undo,
  scrim: () => { if (!$('#sheet').dataset.persist) closeSheet(); },
  'sheet-close': () => closeSheet(),
  'copy-wa': () => copyOrShow(waText(cur), 'Aturan disalin, siap tempel ke WhatsApp'),
  table: () => { tt = true; renderTT(); },
  ttclose: () => { tt = false; renderTT(); },
  settings: () => { sheetKind = 'settings'; openSheet('Pengaturan', settingsHtml(), ''); },
  tools: () => {
    sheetKind = 'tools';
    openSheet('Alat bantu', `<div class="set"><span class="lbl">Siapa jalan duluan?</span><div class="out" id="pickOut">—</div><button class="btn primary" style="width:100%" data-act="pick-first">🎲 Acak pemain</button></div>
    <div class="set"><span class="lbl">Timer</span><div class="big num" id="tmOut">--</div><div class="trio"><button class="btn" data-act="timer" data-s="10">10 dtk</button><button class="btn" data-act="timer" data-s="15">15 dtk</button><button class="btn" data-act="timer" data-s="30">30 dtk</button></div></div>`, '');
  },
  'pick-first': () => {
    const out = $('#pickOut'); const ns = S.players.map(p => p.name); let i = 0; timers.forEach(clearInterval);
    const id = setInterval(() => { out.textContent = ns[Math.floor(Math.random() * ns.length)]; if (++i > 14) { clearInterval(id); out.textContent = '▶ ' + ns[Math.floor(Math.random() * ns.length)]; } }, 70); timers.push(id);
  },
  timer: t => {
    timers.forEach(clearInterval); let s = +t.dataset.s; const out = $('#tmOut'); out.textContent = s; out.style.color = '';
    const id = setInterval(() => { s--; if (s <= 0) { clearInterval(id); out.textContent = '⏰ Habis!'; out.style.color = 'var(--danger)'; try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} } else out.textContent = s; }, 1000); timers.push(id);
  },
  'round-open': openRoundSheet,
  'round-save': () => {
    const g = cur; let round;
    if (sheetKind === 'pres') { round = { id: uid(), o: draft.slice() }; }
    else { const res = g.read($('#rf')); if (res.err) return toast(res.err); round = res.round; }
    const label = 'Ronde ' + (S.rounds.length + 1) + ' tersimpan';
    closeSheet(); mutate(label, S => S.rounds.push(round));
  },
  'ord-add': t => { draft.push(t.dataset.pid); drawOrder(); },
  'ord-undo': () => { draft.pop(); drawOrder(); },
  ev: t => {
    const pid = t.closest('[data-pid]').dataset.pid, k = t.dataset.kind;
    const g = cur; const txt = g.label && g.label[k] ? `${nm(pid)} ${g.label[k]}` : KK[k] ? `${nm(pid)} ${KK[k][0]}` : `${nm(pid)} kalah ronde`;
    mutate(txt, S => S.rounds.push({ id: uid(), p: pid, k }));
  },
  'rd-del': t => mutate('Catatan dihapus', S => { S.rounds = S.rounds.filter(r => r.id !== t.dataset.id); }),
  spmode: t => mutate(null, S => { S.settings.mode = t.dataset.m; }),
  newgame: () => { closeSheet(); mutate('Game baru dimulai', S => { S.rounds = []; }); },
  reset: () => { const f = fresh(cur); closeSheet(); mutate('Data direset', S => { S.players = f.players; S.settings = f.settings; S.rounds = []; }); },
  'pl-del': t => { const n = nm(t.dataset.id); mutate(n + ' dihapus', S => { S.players = S.players.filter(p => p.id !== t.dataset.id); }); },
  share: async () => {
    const text = scoreText();
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyOrShow(text, 'Skor disalin, tinggal tempel ke WhatsApp');
  },
  'exp-copy': () => copyOrShow(JSON.stringify(S), 'Data cadangan disalin'),
  'imp-go': () => {
    try {
      const d = JSON.parse($('#impTa').value);
      if (!d || !Array.isArray(d.players) || !Array.isArray(d.rounds) || !d.players.every(p => p && p.id && typeof p.name === 'string')) throw 0;
      closeSheet(); mutate('Data dipulihkan', S => { S.players = d.players; S.rounds = d.rounds; S.settings = { ...cur.settings, ...(d.settings || {}) }; });
    } catch (e) { toast('Data tidak valid'); }
  }
};
document.addEventListener('click', e => {
  const st = e.target.closest('[data-step]');
  if (st) {
    const inp = st.parentElement.querySelector('input'); const min = inp.min !== '' ? +inp.min : -Infinity, max = inp.max !== '' ? +inp.max : Infinity;
    inp.value = Math.min(max, Math.max(min, num(inp.value) + +st.dataset.step));
    inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true })); return;
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const h = ACT[t.dataset.act]; if (h) { e.stopPropagation(); h(t, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (tt) { tt = false; renderTT(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.gcard')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { F.q = t.value; updateList(); }
  if (t.closest && t.closest('#rf') && cur && cur.preview) cur.preview($('#rf'));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.set === 'target') { S.settings.target = Math.max(cur.tgt.min, num(t.value) || cur.settings.target); save(); renderView(); }
  if (t.dataset && t.dataset.rn) { const p = P(t.dataset.rn), v = t.value.trim(); if (p && v) { p.name = v; save(); renderView(); } else if (p) t.value = p.name; }
  if (t.closest && t.closest('#rf') && cur && cur.preview) cur.preview($('#rf'));
});
document.addEventListener('submit', e => {
  if (e.target.id === 'addf') {
    e.preventDefault(); const v = $('#addn').value.trim() || `${cur.ent} ${S.players.length + 1}`;
    mutate(null, S => S.players.push({ id: uid(), name: v }));
    const a = $('#addn'); if (a) a.focus();
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'hist') histOpen = e.target.open; }, true);

/* ============================================================
   INIT
============================================================ */
(function init() {
  const saved = store.get('rd_theme');
  let dark = false; try { dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  go(parseHash(), true);
})();
})();
</script>
</body>
</html>
